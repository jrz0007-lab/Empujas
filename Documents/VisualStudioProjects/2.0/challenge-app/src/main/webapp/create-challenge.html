<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reto - EMpujas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#9878;</span>
                <span class="logo-text">EMpujas</span>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" class="btn btn-outline">Mi Panel</a>
                <a href="/" class="btn btn-outline">Inicio</a>
            </div>
        </div>
    </nav>

    <main class="container form-page">
        <h1>Crear Nuevo Reto</h1>
        <div class="warning-banner">
            <span class="warning-icon">&#9888;</span>
            <span>Los retos deben ser legales, positivos y verificables mediante video. Asegúrate de que tu objetivo sea claro y alcanzable.</span>
        </div>

        <form id="createChallengeForm" class="create-form">
            <div class="form-group">
                <label for="challengeTitle">Título del Reto</label>
                <input type="text" id="challengeTitle" placeholder="Ej: Aprenderé a tocar la guitarra en 30 días" required>
            </div>

            <div class="form-group">
                <label for="challengeDesc">Descripción</label>
                <textarea id="challengeDesc" rows="5" placeholder="Describe tu reto en detalle. ¿Cuál es el objetivo? ¿Cómo lo lograrás? ¿Cómo lo verificarás?" required></textarea>
            </div>

            <div class="form-group">
                <label for="challengeGoal">Meta de Financiación (&euro;)</label>
                <input type="number" id="challengeGoal" placeholder="0.00" min="1" step="0.01" required>
            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">Crear Reto</button>
            </div>
        </form>

        <div id="createResultado" class="resultado"></div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
