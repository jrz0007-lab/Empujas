<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EMpujas</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#9878;</span>
                <span class="logo-text">EMpujas</span>
            </a>
            <div class="nav-links">
                <a href="register.html" class="btn btn-primary">Registrarse</a>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-icon">&#128274;</div>
            <h1>Iniciar Sesión</h1>
            <p class="auth-subtitle">Introduce tus credenciales para acceder a la plataforma</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
            </form>

            <div id="loginResultado" class="resultado"></div>

            <p class="auth-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 Empujas. Aplicaci&oacute;n web utilizada para que usuarios puedan realizar retos a cambio de algo de dinero, todo dentro de los marcos legales.</p>
        </div>
    </footer>

    <script src="js/app.js?v=3"></script>
</body>
</html>
