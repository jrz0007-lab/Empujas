<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - EMpujas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#9878;</span>
                <span class="logo-text">EMpujas</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="create-challenge.html" class="btn btn-primary">&#128640; Nuevo Reto</a>
                <a href="/" class="btn btn-outline">Inicio</a>
            </div>
        </div>
    </nav>

    <main class="container dashboard">
        <a href="/" class="btn btn-outline back-link">&#11013; Volver a Retos</a>

        <div id="userInfo" class="user-info">
            <div class="user-avatar">&#128100;</div>
            <div>
                <h2 id="dashboardUsername">Usuario</h2>
                <p id="dashboardEmail">usuario@email.com</p>
            </div>
        </div>

        <div id="summaryCards" class="summary-cards">
            <div class="summary-card">
                <div class="summary-icon created">&#128221;</div>
                <div class="summary-number" id="totalCreated">0</div>
                <div class="summary-label">Retos Creados</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon completed">&#9989;</div>
                <div class="summary-number" id="totalCompleted">0</div>
                <div class="summary-label">Completados</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon raised">&#128176;</div>
                <div class="summary-number" id="totalRaised">&euro;0</div>
                <div class="summary-label">Fondos Recaudados</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon favorites">&#128151;</div>
                <div class="summary-number" id="totalFavorited">0</div>
                <div class="summary-label">Favoritos</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="active">&#128640; Activos</button>
            <button class="tab" data-tab="completed">&#9989; Completados</button>
            <button class="tab" data-tab="favorites">&#128151; Favoritos</button>
        </div>

        <div id="tabContent" class="tab-content">
            <div id="dashboardEstado" class="estado"></div>
            <div id="dashboardGrid" class="challenges-grid"></div>
        </div>
    </main>

    <div id="reasonModal" class="modal-overlay hidden">
        <div class="modal-content modal-sm">
            <h3 id="reasonModalTitle">&#128681; Motivo Obligatorio</h3>
            <p id="reasonModalDesc" class="donate-subtitle"></p>
            <form id="reasonForm">
                <div class="form-group">
                    <label for="reasonInput">Explica el motivo:</label>
                    <textarea id="reasonInput" placeholder="Escribe el motivo de esta acci&oacute;n..." rows="4" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelReason">Cancelar</button>
                    <button type="submit" class="btn btn-danger" id="confirmReason">&#128680; Confirmar</button>
                </div>
            </form>
            <div id="reasonResultado" class="donate-resultado"></div>
        </div>
    </div>

    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal-content modal-lg">
            <button class="modal-close" id="closeAdmin">&times;</button>
            <div id="adminContent">
                <h2>&#128737; Panel de Administraci&oacute;n</h2>
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="reports">&#128681; Reportes</button>
                    <button class="admin-tab" data-tab="banned">&#128274; Baneados</button>
                    <button class="admin-tab" data-tab="notifications">&#128231; Notificaciones</button>
                </div>
                <div id="adminTabContent" class="admin-tab-content"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
