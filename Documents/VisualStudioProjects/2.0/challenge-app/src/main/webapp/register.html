<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - EMpujas</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#9878;</span>
                <span class="logo-text">EMpujas</span>
            </a>
            <div class="nav-links">
                <a href="login.html" class="btn btn-outline">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-icon">&#128100;</div>
            <h1>Registrarse</h1>
            <p class="auth-subtitle">Crea tu cuenta y empieza a desafiarte</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">Nombre de Usuario</label>
                    <input type="text" id="regUsername" placeholder="Tu nombre de usuario" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Tu contraseña" required>
                </div>
                <div class="form-group">
                    <label for="regConfirm">Confirmar Contraseña</label>
                    <input type="password" id="regConfirm" placeholder="Confirma tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>
            </form>

            <div id="registerResultado" class="resultado"></div>

            <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 Empujas. Aplicaci&oacute;n web utilizada para que usuarios puedan realizar retos a cambio de algo de dinero, todo dentro de los marcos legales.</p>
        </div>
    </footer>

    <script src="js/app.js?v=5"></script>
</body>
</html>
